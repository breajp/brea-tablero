name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:
  # GitHub corre el cron cuando puede: en octubre largó 3 de las 13 corridas por día, hasta 3 h tarde,
  # y lo apaga solo a los 60 días sin commits porque el repo es público. Lo confiable es el disparador
  # de scripts/apps-script/Disparador.gs (workflow_dispatch cuando cambia la planilla); el cron queda de respaldo.
  schedule:
    - cron: "17 11-23 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      PLANILLA_URL: ${{ secrets.PLANILLA_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test

      # Sin PLANILLA_URL se publica lo que ya está en el repo (apps/web/src/datos/paquetes.json).
      - if: env.PLANILLA_URL != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: env.PLANILLA_URL != ''
        name: Bajar la planilla
        run: |
          pip install --quiet openpyxl==3.1.5
          mkdir -p datos
          curl --silent --fail --location "$PLANILLA_URL" --output datos/planilla.b64
          base64 --decode datos/planilla.b64 > datos/planilla.xlsx
          python datos/extraer.py datos/planilla.xlsx datos/tablero.json
      - if: env.PLANILLA_URL != ''
        name: Cifrar un paquete por usuario
        env:
          CONTRASENAS: ${{ secrets.CONTRASENAS }}
        run: node scripts/cifrar.mjs

      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deploy
        uses: actions/deploy-pages@v4
